<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set Your Password | Land Sterling Investment Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<style>
  :root{ --bg:#F7F5F1; --navy:#1A1F2E; --red:#C0272D; --text:#1A1A1A; --sec:#6B6560; --border:#E0DBD5; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--navy);color:var(--text);
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{background:var(--bg);max-width:460px;width:100%;padding:48px 44px;text-align:center;}
  h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:1.6rem;margin-bottom:8px;letter-spacing:.03em;}
  .rule{width:32px;height:1px;background:var(--red);margin:14px auto 22px;}
  p.sub{font-size:13px;color:var(--sec);line-height:1.7;margin-bottom:26px;}
  input{width:100%;border:1px solid var(--border);background:#fff;padding:13px 16px;font-size:13px;
        border-radius:2px;outline:none;margin-bottom:12px;font-family:inherit;}
  input:focus{border-color:var(--red);}
  button{width:100%;padding:14px;background:var(--red);color:#fff;font-size:11px;font-weight:500;
         letter-spacing:.12em;text-transform:uppercase;border:none;border-radius:2px;cursor:pointer;}
  button:hover{background:#a02025;}
  button:disabled{opacity:.6;cursor:default;}
  .msg{font-size:12.5px;margin-top:14px;line-height:1.6;}
  .err{color:var(--red);}
  .ok{color:#2C6E49;}
  a{color:var(--red);text-decoration:none;font-size:12px;}
</style>
</head>
<body>
  <div class="card">
    <h1>Land Sterling Investment Portal</h1>
    <div class="rule"></div>
    <div id="content">
      <p class="sub">Verifying your link…</p>
    </div>
  </div>

<script>
(async function () {
  const content = document.getElementById('content');

  if (!LS_API.configured) {
    content.innerHTML = '<p class="sub err">The portal backend is not connected yet (see SETUP.md).</p>';
    return;
  }

  // supabase-js automatically reads the invite / recovery token from the URL.
  // Wait briefly for it to establish the session.
  let session = await LS_API.getSession();
  if (!session) {
    await new Promise(r => setTimeout(r, 800));
    session = await LS_API.getSession();
  }

  if (!session) {
    content.innerHTML =
      '<p class="sub err">This link is invalid or has expired. Please request a new one from the sign-in page.</p>' +
      '<a href="index.html">Back to sign in</a>';
    return;
  }

  content.innerHTML =
    '<p class="sub">Welcome. Please choose a password to access the portal.</p>' +
    '<input type="password" id="pw1" placeholder="New password (min. 8 characters)" minlength="8" autocomplete="new-password">' +
    '<input type="password" id="pw2" placeholder="Confirm password" minlength="8" autocomplete="new-password">' +
    '<button id="save">Set Password</button>' +
    '<div class="msg" id="msg"></div>';

  document.getElementById('save').addEventListener('click', async function () {
    const pw1 = document.getElementById('pw1').value;
    const pw2 = document.getElementById('pw2').value;
    const msg = document.getElementById('msg');
    const btn = this;
    msg.className = 'msg';
    if (pw1.length < 8)      { msg.className='msg err'; msg.textContent='Password must be at least 8 characters.'; return; }
    if (pw1 !== pw2)         { msg.className='msg err'; msg.textContent='Passwords do not match.'; return; }
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      const { error } = await LS_API.updatePassword(pw1);
      if (error) throw error;
      msg.className = 'msg ok';
      msg.textContent = 'Password set. Redirecting to the portal…';
      setTimeout(() => { window.location.href = 'index.html'; }, 1500);
    } catch (err) {
      msg.className = 'msg err';
      msg.textContent = err.message || 'Could not set password. Please try again.';
      btn.disabled = false; btn.textContent = 'Set Password';
    }
  });
})();
</script>
</body>
</html>
